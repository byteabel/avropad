<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Shaheed Minar favicon: monument silhouette with the red Ekushey sun -->
  <rect width="64" height="64" rx="12" fill="#0e3a40"/>
  <circle cx="32" cy="28" r="15" fill="#f42a41"/>
  <!-- stepped base -->
  <rect x="18" y="44" width="28" height="4" fill="#f2f6f5"/>
  <rect x="14" y="48" width="36" height="5" fill="#f2f6f5"/>
  <!-- five pillars: center tallest, symmetric pairs -->
  <rect x="29" y="13" width="6" height="35" rx="1" fill="#f2f6f5"/>
  <rect x="21.5" y="21" width="5" height="27" rx="1" fill="#f2f6f5"/>
  <rect x="37.5" y="21" width="5" height="27" rx="1" fill="#f2f6f5"/>
  <rect x="15" y="26" width="4.5" height="22" rx="1" fill="#f2f6f5"/>
  <rect x="44.5" y="26" width="4.5" height="22" rx="1" fill="#f2f6f5"/>
</svg>
